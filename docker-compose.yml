services:
  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}?schema=public
      # Production-mode containers must never start with a public fallback key.
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in the host environment or Compose .env}
      - BANK_ENCRYPTION_KEY=${BANK_ENCRYPTION_KEY:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-auto}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_PREFIX=${S3_PREFIX:-uploads/}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - REDIS_URL=${REDIS_URL:-}
      - BACKEND_PUBLIC_URL=${BACKEND_PUBLIC_URL:-}
      - DEMO_PAYMENTS_ENABLED=${DEMO_PAYMENTS_ENABLED:-}
      - PAYHERE_MERCHANT_ID=${PAYHERE_MERCHANT_ID:-}
      - PAYHERE_MERCHANT_SECRET=${PAYHERE_MERCHANT_SECRET:-}
      - PAYHERE_BASE_URL=${PAYHERE_BASE_URL:-https://sandbox.payhere.lk}
      - PAYHERE_RETURN_URL=${PAYHERE_RETURN_URL:-}
      - PAYHERE_CANCEL_URL=${PAYHERE_CANCEL_URL:-}
      - PAYHERE_NOTIFY_URL=${PAYHERE_NOTIFY_URL:-}
      - NOWPAYMENTS_API_KEY=${NOWPAYMENTS_API_KEY:-}
      - NOWPAYMENTS_IPN_SECRET=${NOWPAYMENTS_IPN_SECRET:-}
      - NOWPAYMENTS_BASE_URL=${NOWPAYMENTS_BASE_URL:-https://api.nowpayments.io/v1}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - PAYOUT_SCHEDULER_ENABLED=${PAYOUT_SCHEDULER_ENABLED:-false}
      - S3_SESSION_TOKEN=${S3_SESSION_TOKEN:-}
      # Cross-origin deployments (e.g. Vercel frontend + this backend) must set
      # this to the frontend origin list; same-origin SPA deployments need nothing.
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - FRONTEND_URL=${FRONTEND_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    # Database port is not exposed publicly by default in production.
    # For local development debugging, expose port 5432 in a docker-compose.override.yml file.
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
