services:
  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-luxora_user}:${POSTGRES_PASSWORD:-luxora_pass}@postgres:5432/${POSTGRES_DB:-luxoradb}?schema=public
      # Production-mode containers must never start with a public fallback key.
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in the host environment or Compose .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-luxora_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-luxora_pass}
      POSTGRES_DB: ${POSTGRES_DB:-luxoradb}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
