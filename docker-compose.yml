services:
  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://luxora_user:luxora_pass@postgres:5432/luxoradb?schema=public
      - JWT_SECRET=${JWT_SECRET:-luxora_super_secret_jwt_2026}
      # Demo seed passwords — override via host env / .env, never hardcode real secrets
      - CUSTOMER_PASSWORD=${CUSTOMER_PASSWORD:-customer123}
      - PROVIDER_PASSWORD=${PROVIDER_PASSWORD:-provider123}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: luxora_user
      POSTGRES_PASSWORD: luxora_pass
      POSTGRES_DB: luxoradb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luxora_user -d luxoradb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
