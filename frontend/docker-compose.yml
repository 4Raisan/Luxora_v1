version: '3.8'

services:
  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://luxora_user:luxora_pass@postgres:5432/luxoradb?schema=public
      - JWT_SECRET=luxora_super_secret_jwt_2026
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: luxora_user
      POSTGRES_PASSWORD: luxora_pass
      POSTGRES_DB: luxoradb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
