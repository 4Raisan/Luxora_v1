name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: luxora_user
          POSTGRES_PASSWORD: luxora_pass
          POSTGRES_DB: luxoradb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luxora_user -d luxoradb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://luxora_user:luxora_pass@127.0.0.1:5432/luxoradb?schema=public
      JWT_SECRET: ci-only-jwt-secret-not-for-deployment
      PAYHERE_MERCHANT_ID: ci-merchant
      PAYHERE_MERCHANT_SECRET: ci-merchant-secret
      PAYMENT_MODE: demo
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm --prefix backend run prisma:generate
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run graph
      - name: Verify generated graph is committed
        run: git diff --exit-code -- Knowladge-Graph/knowledge-graph.json Knowladge-Graph/index.html
