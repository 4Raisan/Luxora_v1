name: Knowledge Graph

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: knowledge-graph-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate and deploy
    timeout-minutes: 10
    environment:
      name: ${{ github.event_name == 'pull_request' && 'knowledge-graph-validation' || 'github-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Protected files guard check
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci/guard-protected-files.mjs

      - name: Install graph build dependencies
        run: npm ci

      - name: Generate Knowledge Graph
        run: npm run graph

      - name: Validate generated graph
        run: node Knowladge-Graph/validate-graph.js

      - name: Verify deterministic generation
        run: |
          cp Knowladge-Graph/knowledge-graph.json /tmp/knowledge-graph.json
          cp Knowladge-Graph/index.html /tmp/knowledge-graph.html
          npm run graph
          cmp --silent /tmp/knowledge-graph.json Knowladge-Graph/knowledge-graph.json
          cmp --silent /tmp/knowledge-graph.html Knowladge-Graph/index.html

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Knowledge Graph artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: Knowladge-Graph

      - name: Deploy Knowledge Graph to GitHub Pages
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4
