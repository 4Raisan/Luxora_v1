<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
<title id="title">Luxora production architecture</title>
<desc id="desc">Customer, Provider and Admin use React and Vite hosted on Vercel. HTTPS REST requests reach Express on Northflank, with authenticated SSE updates. Prisma uses Neon pooled runtime and direct migration connections. Backend integrations include PayHere, NOWPayments, Resend, Cloudflare R2 and Google identity verification. GitHub Actions publishes the knowledge graph to GitHub Pages.</desc>
